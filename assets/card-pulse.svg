<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 225" width="432" height="225" role="img" aria-label="PULSE — Bare-Metal Edge-AI Biometric Anomaly Engine">
  <defs>
    <linearGradient id="cGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    @keyframes packet {
      0% { transform: translateX(0px); opacity: 0.2; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(286px); opacity: 0.2; }
    }
    .pkt { animation: packet 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  </style>

  <rect width="432" height="225" rx="10" fill="#070B14"/>
  <rect width="432" height="225" rx="10" fill="url(#cGlow)"/>
  <rect x="0.75" y="0.75" width="430.5" height="223.5" rx="9.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="18" y="0" width="96" height="2.5" rx="1.2" fill="#00F0FF"/>

  <!-- Header -->
  <text x="20" y="28" class="mono" font-size="10" fill="#00F0FF" font-weight="700" letter-spacing="1.2">SYS.01 // EDGE SILICON</text>
  <rect x="336" y="15" width="76" height="19" rx="4" fill="#082836" stroke="#00F0FF" stroke-width="0.75"/>
  <text x="374" y="28" text-anchor="middle" class="mono" font-size="9.5" fill="#00F0FF" font-weight="700">1.5ms INT8</text>

  <text x="20" y="53" class="sans" font-size="17" fill="#F8FAFC" font-weight="700">pulse-edge-ai</text>
  <text x="412" y="53" text-anchor="end" class="mono" font-size="13" fill="#64748B">↗</text>

  <text x="20" y="74" class="sans" font-size="11.5" fill="#94A3B8">Zero-cloud 1D-Conv Autoencoder &amp; C++ Core-0 anomaly detector</text>
  <text x="20" y="90" class="sans" font-size="11.5" fill="#94A3B8">streaming 64 Hz PPG telemetry directly from ESP32-S3 flash.</text>

  <!-- Schematic Diagram Box -->
  <g transform="translate(20, 104)">
    <rect width="392" height="70" rx="6" fill="#05080F" stroke="#152238" stroke-width="1"/>
    <line x1="56" y1="35" x2="342" y2="35" stroke="#16304A" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle class="pkt" cx="56" cy="35" r="3.5" fill="#00F0FF"/>

    <rect x="12" y="17" width="84" height="36" rx="4" fill="#0B1324" stroke="#1E3A5F" stroke-width="1"/>
    <text x="54" y="33" text-anchor="middle" class="mono" font-size="9" fill="#E2E8F0" font-weight="700">MAX30102</text>
    <text x="54" y="45" text-anchor="middle" class="mono" font-size="8" fill="#64748B">64Hz Optical</text>

    <rect x="112" y="17" width="84" height="36" rx="4" fill="#0B1324" stroke="#1E3A5F" stroke-width="1"/>
    <text x="154" y="33" text-anchor="middle" class="mono" font-size="9" fill="#E2E8F0" font-weight="700">C SOS FILTER</text>
    <text x="154" y="45" text-anchor="middle" class="mono" font-size="8" fill="#00F0FF">1.7e-9 Parity</text>

    <rect x="212" y="17" width="84" height="36" rx="4" fill="#0B1324" stroke="#00F0FF" stroke-width="1"/>
    <text x="254" y="33" text-anchor="middle" class="mono" font-size="9" fill="#00F0FF" font-weight="700">INT8 CONV-AE</text>
    <text x="254" y="45" text-anchor="middle" class="mono" font-size="8" fill="#10B981">0.706 PR-AUC</text>

    <rect x="312" y="17" width="68" height="36" rx="4" fill="#0B1324" stroke="#1E3A5F" stroke-width="1"/>
    <text x="346" y="33" text-anchor="middle" class="mono" font-size="9" fill="#E2E8F0" font-weight="700">WS HUD</text>
    <text x="346" y="45" text-anchor="middle" class="mono" font-size="8" fill="#64748B">68KB Flash</text>
  </g>

  <!-- Footer Tech Spec Chips -->
  <g transform="translate(20, 188)">
    <rect x="0" y="0" width="76" height="21" rx="4" fill="#0D1526"/>
    <text x="38" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#CBD5E1">ESP32-S3</text>

    <rect x="84" y="0" width="88" height="21" rx="4" fill="#0D1526"/>
    <text x="128" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#CBD5E1">TFLite Int8</text>

    <rect x="180" y="0" width="82" height="21" rx="4" fill="#0D1526"/>
    <text x="221" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#CBD5E1">C++ / C11</text>

    <rect x="270" y="0" width="66" height="21" rx="4" fill="#0D1526"/>
    <text x="303" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#CBD5E1">Python</text>
  </g>
</svg>
