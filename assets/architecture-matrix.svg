    <rect x="14" y="30" width="172" height="3" rx="1.5" fill="#132238"/>
    <rect x="14" y="30" width="154" height="3" rx="1.5" fill="#00F0FF"/>
    <text x="14" y="52" class="mono" font-size="10.5" fill="#E2E8F0">· C11 / C++ / Rust</text>
    <text x="14" y="70" class="mono" font-size="10.5" fill="#E2E8F0">· ESP32-S3 Bare-Metal</text>
