    <text x="14" y="70" class="mono" font-size="10.5" fill="#E2E8F0">· TypeScript / Next.js</text>
    <text x="14" y="88" class="mono" font-size="10.5" fill="#E2E8F0">· Real-Time WebSockets</text>
    <text x="14" y="106" class="mono" font-size="10.5" fill="#94A3B8">· Supabase / AWS Cloud</text>
