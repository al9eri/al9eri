    <rect x="14" y="30" width="172" height="3" rx="1.5" fill="#132238"/>
    <rect x="14" y="30" width="162" height="3" rx="1.5" fill="#10B981"/>
    <text x="14" y="52" class="mono" font-size="10.5" fill="#E2E8F0">· Prompt-Inj Firewalls</text>
