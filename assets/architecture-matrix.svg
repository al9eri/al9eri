    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
  </style>

  <rect width="880" height="220" rx="10" fill="#060A12"/>
  <rect width="880" height="220" rx="10" fill="url(#mGrid)" opacity="0.8"/>
  <rect x="0.75" y="0.75" width="878.5" height="218.5" rx="9.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header Strip -->
  <rect x="1" y="1" width="878" height="38" rx="9" fill="#080D18"/>
  <line x1="1" y1="39" x2="879" y2="39" stroke="#1E293B" stroke-width="1"/>
  <rect x="0" y="0" width="4" height="39" rx="2" fill="#10B981"/>
  <text x="20" y="24" class="mono" font-size="11.5" fill="#F8FAFC" font-weight="700" letter-spacing="1.5">02 // FULL-SPECTRUM ARCHITECTURE &amp; TOOLCHAIN MATRIX</text>
  <text x="860" y="24" text-anchor="end" class="mono" font-size="10" fill="#64748B">VERIFIED STACK // 2026</text>

