  <!-- Footer Status Bar -->
  <line x1="20" y1="195" x2="860" y2="195" stroke="#152033" stroke-width="1"/>
  <text x="20" y="210" class="mono" font-size="9.5" fill="#64748B">EOF // BARMOUS COMPLIANCE · KU CYBERSECURITY CLUB · FAB BEDAYA ALUMNI</text>
  <text x="860" y="210" text-anchor="end" class="mono" font-size="9.5" fill="#00F0FF">ABU DHABI, UAE [UTC+4]</text>
