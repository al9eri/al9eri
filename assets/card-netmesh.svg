<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 225" width="432" height="225" role="img" aria-label="RIPv2 Network Automation and Convergence Harness">
  <defs>
    <linearGradient id="aGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    @keyframes faultBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.25; }
    }
    .fault { animation: faultBlink 1.6s ease-in-out infinite; }
  </style>

  <rect width="432" height="225" rx="10" fill="#070B14"/>
  <rect width="432" height="225" rx="10" fill="url(#aGlow)"/>
  <rect x="0.75" y="0.75" width="430.5" height="223.5" rx="9.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="18" y="0" width="96" height="2.5" rx="1.2" fill="#F59E0B"/>

  <!-- Header -->
  <text x="20" y="28" class="mono" font-size="10" fill="#F59E0B" font-weight="700" letter-spacing="1.2">SYS.03 // NET-OPS MESH</text>
  <rect x="330" y="15" width="82" height="19" rx="4" fill="#2B1D06" stroke="#F59E0B" stroke-width="0.75"/>
  <text x="371" y="28" text-anchor="middle" class="mono" font-size="9.5" fill="#F59E0B" font-weight="700">CI PASSING</text>

  <text x="20" y="53" class="sans" font-size="17" fill="#F8FAFC" font-weight="700">rip-network-automation</text>
  <text x="412" y="53" text-anchor="end" class="mono" font-size="13" fill="#64748B">↗</text>

  <text x="20" y="74" class="sans" font-size="11.5" fill="#94A3B8">Autonomous SSH fault-injection harness, 1 Hz routing telemetry,</text>
  <text x="20" y="90" class="sans" font-size="11.5" fill="#94A3B8">and deterministic Cisco IOS simulator measuring RIPv2 failover.</text>

  <!-- Schematic Diagram Box -->
  <g transform="translate(20, 104)">
    <rect width="392" height="70" rx="6" fill="#05080F" stroke="#292112" stroke-width="1"/>

    <!-- Links -->
    <line x1="88" y1="22" x2="184" y2="22" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="136" y="16" text-anchor="middle" class="mono fault" font-size="8.5" fill="#EF4444" font-weight="700">✕ S0/0/0 DOWN</text>

    <path d="M 88 46 L 136 56 L 184 46" fill="none" stroke="#10B981" stroke-width="1.6"/>
    <text x="136" y="66" text-anchor="middle" class="mono" font-size="8" fill="#10B981">REROUTE: METRIC 2 (1.42s)</text>

    <!-- Router Nodes -->
    <rect x="16" y="18" width="72" height="34" rx="4" fill="#0B1324" stroke="#F59E0B" stroke-width="1"/>
    <text x="52" y="33" text-anchor="middle" class="mono" font-size="9" fill="#F8FAFC" font-weight="700">LIB-R1</text>
    <text x="52" y="45" text-anchor="middle" class="mono" font-size="8" fill="#94A3B8">10.1/24</text>

    <rect x="184" y="18" width="72" height="34" rx="4" fill="#0B1324" stroke="#F59E0B" stroke-width="1"/>
    <text x="220" y="33" text-anchor="middle" class="mono" font-size="9" fill="#F8FAFC" font-weight="700">TCH-R2</text>
    <text x="220" y="45" text-anchor="middle" class="mono" font-size="8" fill="#94A3B8">20.1/24</text>

    <line x1="256" y1="35" x2="286" y2="35" stroke="#334155" stroke-width="1.5"/>

    <rect x="286" y="18" width="92" height="34" rx="4" fill="#0B1324" stroke="#1E293B" stroke-width="1"/>
    <text x="332" y="33" text-anchor="middle" class="mono" font-size="9" fill="#F59E0B" font-weight="700">SSH HARNESS</text>
    <text x="332" y="45" text-anchor="middle" class="mono" font-size="8" fill="#94A3B8">1Hz + SimIOS</text>
  </g>

  <!-- Footer Tech Spec Chips -->
  <g transform="translate(20, 188)">
    <rect x="0" y="0" width="84" height="21" rx="4" fill="#0D1526"/>
    <text x="42" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#CBD5E1">Cisco 2901</text>

    <rect x="92" y="0" width="90" height="21" rx="4" fill="#0D1526"/>
    <text x="137" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#CBD5E1">Netmiko SSH</text>

    <rect x="190" y="0" width="66" height="21" rx="4" fill="#0D1526"/>
    <text x="223" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#CBD5E1">RIPv2</text>

    <rect x="264" y="0" width="68" height="21" rx="4" fill="#0D1526"/>
    <text x="298" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#CBD5E1">Pytest</text>
  </g>
</svg>
