<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Zayed Alnuaimi — Systems and Security Architecture">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="55%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="78%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="18%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#131C2E" stroke-width="0.75"/>
    </pattern>
    <pattern id="scopeGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#0F2236" stroke-width="0.6"/>
    </pattern>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 3.5; }
      50% { opacity: 0.35; r: 2.5; }
    }
    @keyframes ppgTrace {
      0% { stroke-dashoffset: 680; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanBar {
      0% { transform: translateX(-120px); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.85; }
      100% { transform: translateX(880px); opacity: 0; }
    }
    .led { animation: pulseDot 2.2s ease-in-out infinite; }
    .ppg-wave {
      stroke-dasharray: 340;
      stroke-dashoffset: 680;
      animation: ppgTrace 4.2s linear infinite;
    }
    .cursor { animation: blinkCursor 1.05s steps(1) infinite; }
    .scanner { animation: scanBar 6s ease-in-out infinite; }
  </style>

  <!-- Chassis Background -->
  <rect width="880" height="360" rx="12" fill="url(#bgGrad)"/>
  <rect width="880" height="360" rx="12" fill="url(#grid)" opacity="0.75"/>
  <rect width="880" height="360" rx="12" fill="url(#cyanGlow)"/>
  <rect width="880" height="360" rx="12" fill="url(#emeraldGlow)"/>
  <rect x="0.75" y="0.75" width="878.5" height="358.5" rx="11.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Tactical Corner Reticles -->
  <path d="M 1 22 L 1 10 Q 1 1 10 1 L 24 1" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 856 1 L 870 1 Q 879 1 879 10 L 879 22" fill="none" stroke="#00F0FF" stroke-width="2"/>
  <path d="M 1 338 L 1 350 Q 1 359 10 359 L 24 359" fill="none" stroke="#10B981" stroke-width="2"/>
  <path d="M 856 359 L 870 359 Q 879 359 879 350 L 879 338" fill="none" stroke="#10B981" stroke-width="2"/>

  <!-- Top Telemetry Header Strip -->
  <rect x="1" y="1" width="878" height="36" rx="11" fill="#070B14" opacity="0.92"/>
  <line x1="1" y1="37" x2="879" y2="37" stroke="#1E293B" stroke-width="1"/>
  <rect class="scanner" x="0" y="36.5" width="120" height="1.5" fill="#00F0FF"/>

  <circle class="led" cx="24" cy="19" r="3.5" fill="#10B981"/>
  <text x="36" y="23" class="mono" font-size="10.5" fill="#10B981" font-weight="700" letter-spacing="1.2">SYS.ONLINE</text>
  <text x="122" y="23" class="mono" font-size="10.5" fill="#64748B">//</text>
  <text x="142" y="23" class="mono" font-size="10.5" fill="#94A3B8" letter-spacing="0.8">ID: AL9ERI</text>
  <text x="228" y="23" class="mono" font-size="10.5" fill="#64748B">//</text>
  <text x="248" y="23" class="mono" font-size="10.5" fill="#94A3B8" letter-spacing="0.8">NODE: 24.4539°N 54.3773°E [ABU DHABI]</text>
  <text x="856" y="23" text-anchor="end" class="mono" font-size="10.5" fill="#00F0FF" letter-spacing="1">AI-SEC · EDGE-ML · ZERO-TRUST GRC</text>

  <!-- LEFT COLUMN: Identity & Proof -->
  <text x="34" y="68" class="mono" font-size="11" fill="#00F0FF" font-weight="600" letter-spacing="1.8">// ARCHITECT &amp; OPERATOR</text>
  <text x="32" y="108" class="sans" font-size="36" fill="url(#titleGrad)" font-weight="800" letter-spacing="-0.5">ZAYED ALNUAIMI</text>

  <text x="34" y="132" class="mono" font-size="11.5" fill="#E2E8F0" font-weight="600">FOUNDER &amp; CEO @ BARMOUS</text>
  <text x="215" y="132" class="mono" font-size="11.5" fill="#475569">·</text>
  <text x="227" y="132" class="mono" font-size="11.5" fill="#10B981" font-weight="600">PRESIDENT @ KU CYBER CLUB</text>

  <rect x="34" y="145" width="420" height="1.5" fill="url(#accentLine)"/>

  <text x="34" y="170" class="sans" font-size="13" fill="#94A3B8">Engineering adversarial-hardened AI compliance pipelines, bare-metal</text>
  <text x="34" y="189" class="sans" font-size="13" fill="#94A3B8">neural inference on ESP32 silicon, and autonomous network test harnesses.</text>

  <!-- Proof / Credential Pills -->
  <g transform="translate(34, 210)">
    <rect width="432" height="34" rx="6" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="3.5" height="34" rx="1.5" fill="#00F0FF"/>
    <text x="16" y="21" class="mono" font-size="10.5" fill="#00F0FF" font-weight="700">01</text>
    <text x="40" y="21" class="mono" font-size="11" fill="#E2E8F0">1ST PLACE — SANDOOQ AL WATAN CYBERSECURITY PITCH</text>
  </g>

  <g transform="translate(34, 252)">
    <rect width="432" height="34" rx="6" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="3.5" height="34" rx="1.5" fill="#10B981"/>
    <text x="16" y="21" class="mono" font-size="10.5" fill="#10B981" font-weight="700">02</text>
    <text x="40" y="21" class="mono" font-size="11" fill="#E2E8F0">LEAD ORGANIZER — 750+ AI &amp; CYBER SUMMER SCHOOL</text>
  </g>

  <g transform="translate(34, 294)">
    <rect width="432" height="34" rx="6" fill="#0B1220" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="0" width="3.5" height="34" rx="1.5" fill="#F59E0B"/>
    <text x="16" y="21" class="mono" font-size="10.5" fill="#F59E0B" font-weight="700">03</text>
    <text x="40" y="21" class="mono" font-size="11" fill="#E2E8F0">KHALIFA UNIVERSITY — B.SC. CS (CYBER SECURITY)</text>
  </g>

  <!-- RIGHT COLUMN TOP: Live Biometric Edge-AI Oscilloscope -->
  <g transform="translate(492, 54)">
    <rect width="360" height="122" rx="8" fill="#070C16" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="1" y="26" width="358" height="95" rx="7" fill="url(#scopeGrid)"/>
    <line x1="0" y1="26" x2="360" y2="26" stroke="#1E293B" stroke-width="1"/>

    <text x="12" y="17" class="mono" font-size="10" fill="#00F0FF" font-weight="700" letter-spacing="0.8">EDGE-NODE // ESP32-S3 TFLITE INT8</text>
    <text x="348" y="17" text-anchor="end" class="mono" font-size="9.5" fill="#10B981">64Hz STREAM</text>

    <!-- Baseline Faint Waveform -->
    <path d="M 12 78 L 42 78 L 50 72 L 58 82 L 68 38 L 78 96 L 86 66 L 96 74 L 112 78 L 146 78 L 154 72 L 162 82 L 172 38 L 182 96 L 190 66 L 200 74 L 216 78 L 250 78 L 258 72 L 266 82 L 276 38 L 286 96 L 294 66 L 304 74 L 348 78"
          fill="none" stroke="#0E3A47" stroke-width="1.5"/>

    <!-- Animated Glowing PPG/ECG Trace -->
    <path class="ppg-wave" filter="url(#neonCyan)"
          d="M 12 78 L 42 78 L 50 72 L 58 82 L 68 38 L 78 96 L 86 66 L 96 74 L 112 78 L 146 78 L 154 72 L 162 82 L 172 38 L 182 96 L 190 66 L 200 74 L 216 78 L 250 78 L 258 72 L 266 82 L 276 38 L 286 96 L 294 66 L 304 74 L 348 78"
          fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Telemetry Readout -->
    <rect x="8" y="99" width="104" height="17" rx="3" fill="#0B1526"/>
    <text x="14" y="111" class="mono" font-size="9.5" fill="#94A3B8">WIN: <tspan fill="#00F0FF" font-weight="700">1.5ms</tspan></text>

    <rect x="120" y="99" width="116" height="17" rx="3" fill="#0B1526"/>
    <text x="126" y="111" class="mono" font-size="9.5" fill="#94A3B8">PR-AUC: <tspan fill="#10B981" font-weight="700">0.706</tspan></text>

    <rect x="244" y="99" width="108" height="17" rx="3" fill="#0B1526"/>
    <text x="250" y="111" class="mono" font-size="9.5" fill="#94A3B8">PARITY: <tspan fill="#F8FAFC" font-weight="700">1.7e-9</tspan></text>
  </g>

  <!-- RIGHT COLUMN BOTTOM: Tactical Verification Terminal -->
  <g transform="translate(492, 188)">
    <rect width="360" height="140" rx="8" fill="#070C16" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="0" y1="25" x2="360" y2="25" stroke="#1E293B" stroke-width="1"/>
    <circle cx="14" cy="12.5" r="3.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="26" cy="12.5" r="3.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="38" cy="12.5" r="3.5" fill="#10B981" opacity="0.8"/>
    <text x="54" y="16" class="mono" font-size="9.5" fill="#64748B">tty0 — zayed@al9eri-sec-ops:~</text>

    <text x="14" y="45" class="mono" font-size="10.2" fill="#E2E8F0"><tspan fill="#00F0FF">$</tspan> aegis scan --strict ./soc2_bundle/</text>
    <text x="14" y="61" class="mono" font-size="10" fill="#10B981">[PASS] sha256 attested · 0 prompt-inj vectors</text>

    <text x="14" y="81" class="mono" font-size="10.2" fill="#E2E8F0"><tspan fill="#00F0FF">$</tspan> pulse-deploy --mcu esp32s3 --int8</text>
    <text x="14" y="97" class="mono" font-size="10" fill="#10B981">[PASS] 4.0MB conv-ae · core0 c++ self=pass</text>

    <text x="14" y="117" class="mono" font-size="10.2" fill="#E2E8F0"><tspan fill="#00F0FF">$</tspan> netmesh run T1..T5 --cisco-2901</text>
    <text x="14" y="132" class="mono" font-size="10" fill="#10B981">[PASS] 3/3 ripv2 nodes converged (1.42s)</text>
    <rect class="cursor" x="266" y="123" width="6.5" height="11" fill="#00F0FF"/>
  </g>
</svg>
